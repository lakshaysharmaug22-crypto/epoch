id: rag-answer
version: 1.0.0
description: Grades a RAG answer against the retrieved context and the question.
pass_threshold: 0.75
criteria:
  - name: grounded
    weight: 0.35
    hard_gate: true
    anchors:
      1: States facts that contradict or are absent from the context.
      2: Mostly supported, with at least one unsupported detail.
      3: Fully supported by the context, minor paraphrase.
      4: Every claim is directly traceable to a context sentence.
  - name: correct
    weight: 0.35
    anchors:
      1: Wrong entity or wrong value.
      2: Right entity, value partially correct or ambiguous.
      3: Correct value with unnecessary hedging.
      4: Exactly the value the question asks for.
  - name: complete
    weight: 0.15
    anchors:
      1: Does not answer the question.
      2: Answers only part of a multi-part question.
      3: Answers the question but omits the unit or condition.
      4: Answers fully, including unit or condition.
  - name: concise
    weight: 0.15
    anchors:
      1: Rambles or adds unrelated content.
      2: Two or more unnecessary sentences.
      3: One unnecessary clause.
      4: Only the answer.
