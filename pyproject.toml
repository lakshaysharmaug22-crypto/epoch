[project]
name = "epoch-ai"
version = "0.1.0"
description = "EPOCH — autonomous AI engineering & evolution platform: evolves AI pipelines to a constraint-aware Pareto frontier, simulates them, and heals them in production."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "optuna>=4.0",
  "pymoo>=0.6.1",
  "rapidfuzz>=3.6",
  "simpy>=4.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sse-starlette>=2.0",
  "langgraph>=0.2",
  "anthropic>=0.40",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.24",
  "opentelemetry-sdk>=1.24",
  "onnxruntime>=1.17",
  "skl2onnx>=1.16",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.3",
  "transformers>=4.44",
  "accelerate>=0.33",
  "bitsandbytes>=0.43",
  "sentence-transformers>=3.0",
  "faiss-cpu>=1.8",
  "optimum[onnxruntime-gpu]>=1.21",
  "pynvml>=11.5",
]
infra = [
  "psycopg[binary]>=3.1",
  "pgvector>=0.3",
  "celery>=5.3",
  "redis>=5.0",
  "mlflow>=2.14",
  "opentelemetry-exporter-otlp>=1.24",
  "locust>=2.24",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
epoch = "epoch.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["epoch"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
follow_imports = "silent"  # strict typing is enforced module-by-module; the list below is the typed core
files = ["epoch/genome.py", "epoch/objectives.py", "epoch/evolution/pareto.py", "epoch/twin/sim.py", "epoch/healing/detector.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning", "ignore::FutureWarning"]
